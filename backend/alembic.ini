# Alembic configuration file for Road Intelligence Platform
# Reference: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to the alembic migrations directory (relative to this ini file)
script_location = alembic

# Template used to generate migration file names; default value is %%(rev)s_%%(slug)s
# Uncomment to customise:
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path extension for importing app modules when running alembic standalone
prepend_sys_path = .

# Version path separator used when creating multiple version directories.
# Valid values are: space, newline, comma (default is newline)
# version_path_separator = os  # Use os.pathsep

# The output encoding used when revision files are written from script.py.mako
# output_encoding = utf-8

# SQLAlchemy database URL.
# In practice this is overridden by env.py reading DATABASE_URL from the environment.
# Provide a synchronous (psycopg2) URL here because Alembic's offline mode uses it
# directly; env.py swaps to asyncpg at runtime.
sqlalchemy.url = postgresql+psycopg2://roaduser:roadpass@localhost:5432/roadintelligence


# ----- Logging configuration ------------------------------------------------
# This section is for the standard Python logging.config.fileConfig() call.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
